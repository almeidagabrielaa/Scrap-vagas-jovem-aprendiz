# Regiões conhecidas pelo radar.
#
# Estrutura: cidade -> distritos -> bairros.
# - "apelidos" (do distrito ou do bairro) são outras formas de escrever o nome
#   que, se aparecerem no anúncio, identificam o local.
# - Bairros com "ambiguo: true" têm nomes que também são palavras comuns
#   ("Centro", "Passagem", "Dunas"...). Eles só contam quando o texto deixa claro
#   que é um bairro: "bairro Centro", "Centro, Cabo Frio", "Rua X - Centro".
#
# - "coordenadas" [latitude, longitude] são usadas para calcular a distância (radar buscar --perto-de).
#   Foram obtidas do OpenStreetMap e conferidas contra o distrito; bairros sem coordenada usam o
#   endereço do anúncio quando houver. Corrija ou complete à vontade (ex.: copiando do Google Maps).
#
# Os bairros de Cabo Frio vêm da base de CEPs dos Correios (via ViaCEP).
# Os Correios marcam os bairros do 2º Distrito com o sufixo "(Tamoios)".
# Para adicionar outra cidade, copie o bloco de Cabo Frio e ajuste.
# Cidades sem distritos (como as vizinhas no fim do arquivo) são filtradas só pela cidade.
# "coordenadas" da cidade = centro urbano (OpenStreetMap), usado para a distância das vagas vizinhas.

cabo-frio:
  nome: Cabo Frio
  uf: RJ
  coordenadas: [-22.8804, -42.0189]  # centro da cidade
  # Cidades incluídas quando a busca pede "cidades vizinhas".
  vizinhas: [arraial-do-cabo, armacao-dos-buzios, sao-pedro-da-aldeia, iguaba-grande, araruama,
             saquarema, rio-das-ostras, casimiro-de-abreu, macae]
  distritos:
    1:
      nome: 1º Distrito (Sede)
      apelidos: ["1o distrito", "primeiro distrito"]
